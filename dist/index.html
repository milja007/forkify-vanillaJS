    <div class=container>

            <li class=nav__item>

                    </p>
                  </div>

                  
                </ul>
              </div>
            </li>
          </ul>
        </nav>
      </header>

      <div class=search-results>
        <ul class=results>
          
        </ul>

        <div class=pagination>
          
        </div>
      </div>

          <div>
            <svg><use href=icons.c5b0f01c.svg#icon-smile /></svg>

          <input value=TEST123 required name=image>
          <label>Publisher</label>
          <input value=TEST123 required name=publisher>
